; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[platformio]
;; « pio run » et le bouton Build ne compilent que le firmware
;default_envs = teensy41

[env:teensy41]
platform = symlink://./platform/platform-teensy
board = teensy41
framework = arduino
lib_deps = ./lib
monitor_port = COM3
; Les tests (src/test_servos/, src/test_sonars/) ne sont pas dans le firmware
;build_src_filter = +<*> -<test_servos/> -<test_sonars/>
; Copie firmware.hex dans firmware/ après chaque build (flash depuis le Pi)
extra_scripts = post:scripts/copie_hex.py

; Test unitaire des 3 servos (pins 2 / 3 / 4), programme à part.
;   pio run -e test_servos -t upload    puis    pio device monitor -e test_servos
; Pas de copie_hex.py : ne remplace pas le firmware.hex du Pi.
; Reflasher le firmware normal (env teensy41) après le test.
;[env:test_servos]
;platform = symlink://./platform/platform-teensy
;board = teensy41
;framework = arduino
;lib_deps = ./lib
;monitor_port = COM3
;monitor_speed = 115200
;build_src_filter = -<*> +<test_servos/>

; Test unitaire des 3 sonars (pins 14 / 15 / 16), programme à part.
;   pio run -e test_sonars -t upload    puis    pio device monitor -e test_sonars
; Pas de copie_hex.py. Reflasher le firmware normal (env teensy41) après le test.
;[env:test_sonars]
;platform = symlink://./platform/platform-teensy
;board = teensy41
;framework = arduino
;lib_deps = ./lib
;monitor_port = COM3
;monitor_speed = 115200
;build_src_filter = -<*> +<test_sonars/>
